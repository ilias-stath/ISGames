<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Head Football Menu</title>
<style>
	:root {
		color-scheme: dark;
		--bg: #1a3a1a;
		--panel: rgba(26, 58, 26, 0.86);
		--panel-border: rgba(135, 206, 235, 0.25);
		--text: #f4f7ff;
		--muted: #a7d4b3;
		--accent: #4ade80;
		--accent-2: #87ceeb;
		--danger: #ff8f8f;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		min-height: 100vh;
		display: grid;
		place-items: center;
		font-family: Arial, sans-serif;
		color: var(--text);
		background:
			radial-gradient(circle at top, rgba(135, 206, 235, 0.2), transparent 35%),
			radial-gradient(circle at bottom left, rgba(74, 222, 128, 0.15), transparent 30%),
			linear-gradient(135deg, #0d2a0d, #1a4a1a 55%, #0d2a0d);
		overflow: hidden;
	}

	.panel {
		width: min(92vw, 440px);
		padding: 32px;
		border: 1px solid var(--panel-border);
		border-radius: 24px;
		background: var(--panel);
		box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
		backdrop-filter: blur(14px);
	}

	h1 {
		margin: 0 0 10px;
		font-size: 2.4rem;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		color: var(--accent);
	}

	p {
		margin: 0 0 22px;
		color: var(--muted);
		line-height: 1.5;
	}

	.buttons {
		display: grid;
		gap: 12px;
	}

	button {
		appearance: none;
		border: 0;
		border-radius: 14px;
		padding: 15px 18px;
		font-size: 1rem;
		font-weight: 700;
		cursor: pointer;
		color: #0a1f0a;
		transition: transform 0.15s ease, filter 0.15s ease;
	}

	button:hover {
		transform: translateY(-1px);
		filter: brightness(1.05);
	}

	.easy {
		background: linear-gradient(135deg, #4ade80, #bbf7d0);
	}

	.normal {
		background: linear-gradient(135deg, #87ceeb, #d6f0ff);
	}

	.hard {
		background: linear-gradient(135deg, #fbbf24, #ffe8a8);
	}

	.pvp {
		background: linear-gradient(135deg, #7dd3fc, #e0f2fe);
	}

	.back {
		background: transparent;
		color: var(--text);
		border: 1px solid var(--panel-border);
		border-radius: 12px;
		padding: 10px 14px;
		font-weight: 700;
		cursor: pointer;
	}

	.hint {
		margin-top: 16px;
		font-size: 0.92rem;
		color: var(--muted);
		text-align: center;
	}
</style>
</head>
<body>
<main class="panel">
	<h1>Head Football</h1>
	<p>Hit the ball with your head and your foot. Select a game mode to start.</p>
	<div class="buttons">
		<button class="easy" onclick="startGame('easy')">Easy</button>
		<button class="normal" onclick="startGame('normal')">Normal</button>
		<button class="hard" onclick="startGame('hard')">Hard</button>
		<button class="pvp" onclick="startGame('2player')">2-Player</button>
	</div>
	<div class="hint" id="menuCatchphrase"></div>
	<div style="text-align:center;margin-top:16px;">
		<button class="back" onclick="location.href='../index.html'">Back to Home</button>
	</div>
</main>
<script>
const catchphrases = [
	"Use your head wisely.",
	"Head, shoulders, knees, and... goals!",
	"Kick it like you mean it.",
	"Your noggin is your weapon.",
	"Score with style.",
	"May the header be with you.",
	"Don't use your hands. This is football.",
	"One foot in front of the other.",
	"Head over heels for football."
];

const menuCatchphrase = document.getElementById('menuCatchphrase');
const randomIndex = Math.floor(Math.random() * catchphrases.length);
menuCatchphrase.textContent = catchphrases[randomIndex];

function startGame(difficulty) {
	if (difficulty === '2player') {
		location.href = 'headball_2_player_game.html';
	} else {
		sessionStorage.setItem('headballAccess', difficulty);
		location.href = `headball_game_${difficulty}.html`;
	}
}
</script>
</body>
</html>
