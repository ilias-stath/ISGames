<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake — Start</title>
  <style>
    :root{
      --green-dark:#083e26;
      --green-mid:#0f7a4c;
      --green-light:#dff7e8;
      --brown:#7a5230;
      --red:#ef4444;
      --text:#eaf8f0;
      --muted:#cfeee0;
      --accent:#0fb670;
      --panel:rgba(255,255,255,0.02);
      --border:rgba(6,40,28,0.06);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family: 'Arial', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(15,182,112,0.14), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(122,82,48,0.06), transparent 22%),
        linear-gradient(135deg, #8f502f, var(--green-mid) 55%, #8f502f);
    }
    .panel{width:min(92vw,520px);padding:36px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.28));border:1px solid rgba(255,255,255,0.25);box-shadow:0 18px 50px rgba(0,0,0,0.15);text-align:center}
    h1{margin:0 0 8px;font-size:2.2rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--text)}
    p{margin:0 0 18px;color:var(--muted)}
    .buttons{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
    .btn{border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:1rem;transition:transform .12s ease,box-shadow .12s ease;width:240px;max-width:84%;text-align:center}
    .btn:focus{outline:2px solid rgba(15,182,112,0.14)}
    .start{background:linear-gradient(135deg,var(--accent),#34d399);color:#ffffff;box-shadow:0 6px 20px rgba(122,82,48,0.06)}
    .back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(122,82,48,0.06)}
    .mode-row{display:flex;align-items:center;justify-content:center;gap:10px;width:240px;max-width:84%}
    .mode-label{font-size:0.88rem;color:var(--muted);white-space:nowrap}
    .toggle{position:relative;display:inline-flex;align-items:center;width:64px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.1);padding:3px;cursor:pointer;flex:none}
    .toggle input{position:absolute;opacity:0;pointer-events:none}
    .toggle-track{width:100%;height:100%;border-radius:999px;transition:background .15s ease;display:block;background:rgba(255,255,255,0.12)}
    .toggle-thumb{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:white;box-shadow:0 3px 10px rgba(0,0,0,0.18);transition:transform .15s ease}
    .toggle input:checked + .toggle-track{background:linear-gradient(135deg,var(--accent),#34d399)}
    .toggle input:checked ~ .toggle-thumb{transform:translateX(30px)}
    .hint{margin-top:14px;color:var(--muted);font-size:0.92rem}
  </style>
</head>
<body>
  <main class="panel">
    <h1>Snake</h1>
    <p>Classic snake — eat apples to grow. Edges wrap around; avoid hitting yourself.</p>
    <div class="buttons">
      <button class="btn start" id="startBtn">Single Player</button>
      <div class="mode-row" aria-label="single player mode toggle">
        <span class="mode-label" id="modeLabel">Single Mode: Classic</span>
        <label class="toggle" title="Switch single-player mode">
          <input type="checkbox" id="modeToggle" />
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <button class="btn start" id="start2Btn">2 Players</button>
      <div class="mode-row" aria-label="2 player mode toggle">
        <span class="mode-label" id="mode2Label">2P Mode: Classic</span>
        <label class="toggle" title="Switch 2-player mode">
          <input type="checkbox" id="mode2Toggle" />
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <button class="btn back" id="homeBtn">Back to Home</button>
    </div>
    <div class="hint" id="catchPhrase"></div>
  </main>

  <script>
    const phrases = [
      'Only a long snake is a good snake.',
      'One apple at a time.',
      'Grow, eat, repeat. Wait the sequence is wrong.',
      'Eat apples, avoid yourself.',
      'Reflexes and planning win.'
    ];
    document.getElementById('catchPhrase').textContent = phrases[Math.floor(Math.random()*phrases.length)];

    const modeToggle = document.getElementById('modeToggle');
    const modeLabel = document.getElementById('modeLabel');
    const mode2Toggle = document.getElementById('mode2Toggle');
    const mode2Label = document.getElementById('mode2Label');

    function updateModeLabel(){
      modeLabel.textContent = modeToggle.checked ? 'Single Mode: Bombs' : 'Single Mode: Classic';
    }

    function updateMode2Label(){
      mode2Label.textContent = mode2Toggle.checked ? '2P Mode: Mayhem (Bombs)' : '2P Mode: Classic';
    }

    modeToggle.addEventListener('change', updateModeLabel);
    updateModeLabel();

    mode2Toggle.checked = false;
    mode2Toggle.addEventListener('change', updateMode2Label);
    updateMode2Label();

    document.getElementById('startBtn').addEventListener('click', ()=>{
      const variant = modeToggle.checked ? 'bombs' : 'classic';
      sessionStorage.setItem('snakeSoloMode', variant);
      location.href = `snake_game.html?mode=solo&variant=${encodeURIComponent(variant)}`;
    });
    document.getElementById('start2Btn').addEventListener('click', ()=>{
      const variant = mode2Toggle.checked ? 'mayhem' : 'classic';
      sessionStorage.setItem('snake2Mode', variant);
      location.href = `snake_2_player_game.html?variant=${encodeURIComponent(variant)}`;
    });

    document.getElementById('homeBtn').addEventListener('click', ()=>{
      location.href = '../index.html';
    });
  </script>
</body>
</html>
