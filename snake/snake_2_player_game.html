<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — 2 Players</title>
  <style>
    :root{
      --green-dark:#083e26;
      --green-mid:#0f7a4c;
      --green-light:#dff7e8;
      --brown:#7a5230;
      --red:#ef4444;
      --text:#eaf8f0;
      --muted:#cfeee0;
      --accent:#0fb670;
      --apple:#ef4444;
      --panel:rgba(255,255,255,0.02);
      --border:rgba(6,40,28,0.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family: 'Arial', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:var(--text);overflow:hidden; background:
      radial-gradient(circle at 12% 18%, rgba(15,182,112,0.14), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(122,82,48,0.06), transparent 22%),
      linear-gradient(135deg, #8f502f, var(--green-mid) 55%, #8f502f);} 
    .back-button{position:fixed;top:16px;left:16px;z-index:2;padding:10px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.08));color:var(--text);font-weight:700;cursor:pointer}
    .hud{display:flex;gap:12px;margin-bottom:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.08));border:1px solid rgba(255,255,255,0.15);align-items:center;box-shadow:0 8px 24px rgba(0,0,0,0.1)}
    .hud-item{padding:8px 12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.08));text-align:center}
    .hud-label{display:block;font-size:0.75rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase}
    .hud-value{display:block;font-size:1.6rem;font-weight:800;color:var(--accent)}
    #game-area{width:640px;height:480px;border-radius:12px;overflow:visible;border:2px solid rgba(255,255,255,0.04);box-shadow:0 10px 30px rgba(0,0,0,0.08);background:linear-gradient(135deg, rgba(10,60,30,0.06) 0%, rgba(10,60,30,0.02) 100%);position:relative}
    canvas{display:block;background:transparent}
    .controls-hint{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      z-index:2;
      pointer-events:none;
    }
    .controls-hint.left{left:calc((100vw - 640px) / 4);transform:translate(-50%, -50%)}
    .controls-hint.right{right:calc((100vw - 640px) / 4);transform:translate(50%, -50%)}
    .controls-keypad{display:flex;flex-direction:column;gap:8px;align-items:center}
    .key-row{display:flex;gap:8px}
    .key-row.top{justify-content:center}
    .key-row.middle{justify-content:space-between}
    .key-chip{width:62px;height:46px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:linear-gradient(180deg, rgba(255,255,255,0.16), rgba(8,12,24,0.82));color:#f4f7ff;font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;box-shadow:0 10px 22px rgba(0,0,0,0.22), inset 0 0 18px rgba(255,255,255,0.05)}
    .hint-label{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted)}
    .start-overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg, rgba(10,60,30,0.18), rgba(10,60,30,0.12));z-index:3}
    .start-overlay.hidden{display:none}
    .overlay-card{padding:24px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.08));border:1px solid rgba(255,255,255,0.15);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 36px rgba(0,0,0,0.08)}
    .overlay-count{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#34d399);color:#fff}
    .mayhem-hint{margin-top:14px;max-width:640px;padding:10px 14px;border-radius:12px;background:rgba(8,12,24,0.58);border:1px solid rgba(255,255,255,0.14);color:var(--muted);font-size:0.92rem;line-height:1.45;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,0.12)}
    .mayhem-hint.hidden{display:none}
  </style>
</head>
<body>
  <button class="back-button" onclick="location.href='snake_start.html'">Back to Menu</button>
    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">Player 2</span>
        <span class="hud-value" id="scoreP1">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Player 1</span>
        <span class="hud-value" id="scoreP2">0</span>
      </div>
    </div>

  <div id="game-area">
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="controls-hint left" aria-hidden="true">
      <div class="hint-label">Player 2</div>
      <div class="controls-keypad">
        <div class="key-row top"><div class="key-chip">W</div></div>
        <div class="key-row middle"><div class="key-chip">A</div><div class="key-chip">S</div><div class="key-chip">D</div></div>
      </div>
    </div>

    <div class="controls-hint right" aria-hidden="true">
      <div class="hint-label">Player 1</div>
      <div class="controls-keypad">
        <div class="key-row top"><div class="key-chip">Up</div></div>
        <div class="key-row middle"><div class="key-chip">Left</div><div class="key-chip">Down</div><div class="key-chip">Right</div></div>
      </div>
    </div>

    <div class="start-overlay" id="startOverlay">
      <div class="overlay-card">
        <div style="margin-bottom:12px;font-weight:700;color:var(--accent)" id="overlayPhrase">Get Ready</div>
        <div class="overlay-count" id="overlayCount">3</div>
      </div>
    </div>
  </div>

  <div class="mayhem-hint hidden" id="mayhemHint">
    Mayhem mode: you can eat your enemy last body part. If he is only 3 body parts he will lose. BUT be careful, cause you could lose also.
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const player2ScoreDisplay = document.getElementById('scoreP1');
    const player1ScoreDisplay = document.getElementById('scoreP2');
    const startOverlay = document.getElementById('startOverlay');
    const overlayCount = document.getElementById('overlayCount');
    const overlayPhrase = document.getElementById('overlayPhrase');
    const mayhemHint = document.getElementById('mayhemHint');

    const catchphrases = [
      'Grow long and thrive.',
      'Careful not to eat too many, your tummy will hurt.',
      'Avoid the edges or not.',
      'Eat apples, avoid yourself.',
      'Reflexes and planning win.',
      'Devour your enemy!!!!',
      'Don\'t lose'
    ];

    const COLS = 32; // grid columns (640 / 20)
    const ROWS = 24; // grid rows (480 / 20)
    const CELL = 20;

    const params = new URLSearchParams(location.search);
    const duoVariant = params.get('variant') || sessionStorage.getItem('snake2Mode') || 'classic';
    const isMayhem = duoVariant === 'mayhem' || duoVariant === 'bombs';
    const isBombsMode = isMayhem;
    if(isMayhem){
      mayhemHint.textContent = 'Mayhem mode: tail battles + bombs. If enemy has only 3 body parts and you hit the tail, they lose. Bombs are dangerous: with score under 2 or size 3, bomb hit is instant defeat.';
      mayhemHint.classList.remove('hidden');
    } else {
      mayhemHint.classList.add('hidden');
    }

    // duo-only game
    let snake = [];
    let dir = {x:-1,y:0};
    let pendingDirs = [];

    let snake2 = [];
    let dir2 = {x:1,y:0};
    let pendingDirs2 = [];

    let apples = [];
    let bombs = [];
    const MAX_BOMBS = 3;
    let score = 0;
    let score2 = 0;
    let isGameActive = false;
    let moveInterval = null;

    function placeApples(){
      const target = Math.max(1, Math.floor(Math.random()*3) + 1);
      while(apples.length < target){
        let spot; let tries = 0;
        while(true){
          spot = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
          const occupied = snake.some(s=>s.x===spot.x && s.y===spot.y) || snake2.some(s=>s.x===spot.x && s.y===spot.y) || apples.some(a=>a.x===spot.x && a.y===spot.y) || bombs.some(b=>b.x===spot.x && b.y===spot.y);
          if(!occupied) break;
          if(++tries>200) break;
        }
        apples.push(spot);
      }
    }

    function placeBombs(){
      if(!isBombsMode){
        bombs = [];
        return;
      }
      while(bombs.length < MAX_BOMBS){
        let spot;
        let tries = 0;
        while(true){
          spot = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
          const occupied = snake.some(s=>s.x===spot.x && s.y===spot.y) || snake2.some(s=>s.x===spot.x && s.y===spot.y) || apples.some(a=>a.x===spot.x && a.y===spot.y) || bombs.some(b=>b.x===spot.x && b.y===spot.y);
          if(!occupied) break;
          if(++tries>300) break;
        }
        bombs.push(spot);
      }
    }

    function draw(topSnake){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
      bgGrad.addColorStop(0, '#a0714f'); bgGrad.addColorStop(1, '#8b6a47');
      ctx.fillStyle = bgGrad; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = '#3d2817';
      for(let gx = 0; gx < COLS; gx++){
        for(let gy = 0; gy < ROWS; gy++){
          const seed = (gx * 73856093 ^ gy * 19349663) >>> 0;
          const rand = ((seed * 1103515245 + 12345) >>> 16) % 100;
          if(rand < 30){
            const x = gx * CELL + (CELL/2);
            const y = gy * CELL + (CELL/2);
            const size = ((seed * 1103515245 + 12345) >>> 16) % 6 + 1.5;
            ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      ctx.restore();

      // apples
      for(const apple of apples){
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--apple') || '#ef4444';
        const cx = apple.x * CELL + CELL/2; const cy = apple.y * CELL + CELL/2; const r = CELL*0.38;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(10,90,50,0.9)'; ctx.beginPath(); ctx.ellipse(cx + r*0.28, cy - r*0.6, r*0.2, r*0.12, -Math.PI/6, 0, Math.PI*2); ctx.fill();
      }

      if(isBombsMode){
        for(const bomb of bombs){
          const bx = bomb.x * CELL + CELL/2;
          const by = bomb.y * CELL + CELL/2;
          const br = CELL*0.38;
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(bx, by, br, 0, Math.PI*2);
          ctx.fill();
        }
      }

      function drawSnake1(){
        for(let i=0;i<snake.length;i++){
          const s = snake[i]; const x = s.x*CELL, y = s.y*CELL;
          const grad = ctx.createLinearGradient(x,y,x+CELL,y+CELL);
          if(i===0){ grad.addColorStop(0, '#044d31'); grad.addColorStop(1, '#0fa97a'); }
          else { grad.addColorStop(0, '#0b7a50'); grad.addColorStop(1, '#12c28a'); }
          ctx.fillStyle = grad; ctx.fillRect(x+1, y+1, CELL-2, CELL-2);
          ctx.strokeStyle = 'rgba(122,82,48,0.18)'; ctx.lineWidth = 1; ctx.strokeRect(x+0.5, y+0.5, CELL-1, CELL-1);
        }
      }

      function drawSnake2(){
        for(let i=0;i<snake2.length;i++){
          const s = snake2[i]; const x = s.x*CELL, y = s.y*CELL;
          const grad = ctx.createLinearGradient(x,y,x+CELL,y+CELL);
          if(i===0){ grad.addColorStop(0, '#083a5a'); grad.addColorStop(1, '#2aa0ff'); }
          else { grad.addColorStop(0, '#0b6fa5'); grad.addColorStop(1, '#4fb8ff'); }
          ctx.fillStyle = grad; ctx.fillRect(x+1, y+1, CELL-2, CELL-2);
          ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1; ctx.strokeRect(x+0.5, y+0.5, CELL-1, CELL-1);
        }
      }

      if(topSnake === 'p1'){
        drawSnake2();
        drawSnake1();
      } else if(topSnake === 'p2'){
        drawSnake1();
        drawSnake2();
      } else {
        drawSnake1();
        drawSnake2();
      }
    }

    function moveTick(){
      if(pendingDirs.length){
        dir = pendingDirs.shift();
      }
      if(pendingDirs2.length){
        dir2 = pendingDirs2.shift();
      }
      const head = snake[0]; const nx = (head.x + dir.x + COLS) % COLS; const ny = (head.y + dir.y + ROWS) % ROWS;
      const head2 = snake2[0]; const nx2 = (head2.x + dir2.x + COLS) % COLS; const ny2 = (head2.y + dir2.y + ROWS) % ROWS;

      let p1Lose = false, p2Lose = false;
      let p1LoseReason = '', p2LoseReason = '';
      let collisionAttacker = null;
      function setAttacker(player){
        if(collisionAttacker === null){
          collisionAttacker = player;
        } else if(collisionAttacker !== player){
          collisionAttacker = 'both';
        }
      }
      // self
      if(snake.some((seg, idx)=> idx>0 && seg.x===nx && seg.y===ny)){
        p1Lose = true;
        p1LoseReason = 'Player 1 hit their own body';
        setAttacker('p1');
      }
      if(snake2.some((seg, idx)=> idx>0 && seg.x===nx2 && seg.y===ny2)){
        p2Lose = true;
        p2LoseReason = 'Player 2 hit their own body';
        setAttacker('p2');
      }

      const p1BombIdx = isBombsMode ? bombs.findIndex(b => b.x===nx && b.y===ny) : -1;
      const p2BombIdx = isBombsMode ? bombs.findIndex(b => b.x===nx2 && b.y===ny2) : -1;

      if(isBombsMode){
        if(p1BombIdx !== -1 && (score < 2 || snake.length <= 3)){
          p1Lose = true;
          p1LoseReason = 'Player 1 hit a bomb at low score/size';
          setAttacker('p1');
        }
        if(p2BombIdx !== -1 && (score2 < 2 || snake2.length <= 3)){
          p2Lose = true;
          p2LoseReason = 'Player 2 hit a bomb at low score/size';
          setAttacker('p2');
        }
      }

      // Check if heads move to the same position (head-to-head collision)
      if(nx === nx2 && ny === ny2){
        p1Lose = true; p2Lose = true;
        p1LoseReason = 'Head-to-head collision';
        p2LoseReason = 'Head-to-head collision';
        setAttacker('both');
      } else {
        // collision with other player body/head
        if(!isMayhem){
          // classic mode: any collision is a loss
          if(snake2.some(seg => seg.x===nx && seg.y===ny)){
            p1Lose = true;
            p1LoseReason = 'Player 1 hit Player 2';
            setAttacker('p1');
          }
          if(snake.some(seg => seg.x===nx2 && seg.y===ny2)){
            p2Lose = true;
            p2LoseReason = 'Player 2 hit Player 1';
            setAttacker('p2');
          }
        } else {
          // mayhem mode: only enemy tail can be eaten; any other enemy body hit is a loss.
          const p1HitP2Idx = snake2.findIndex(seg => seg.x===nx && seg.y===ny);
          if(p1HitP2Idx !== -1){
            if(p1HitP2Idx === 0){
              // head-to-head: both lose and scores reset
              score = 0; score2 = 0;
              player2ScoreDisplay.textContent = String(score2);
              player1ScoreDisplay.textContent = String(score);
              p1Lose = true; p2Lose = true;
              p1LoseReason = 'Head-to-head collision';
              p2LoseReason = 'Head-to-head collision';
              setAttacker('both');
            } else {
              const p2TailIdx = snake2.length - 1;
              const canEatTail = p1HitP2Idx === p2TailIdx && snake2.length > 3;
              if(canEatTail){
                snake2.pop();
                score++;
                if(score2 > 0) score2--;
                player2ScoreDisplay.textContent = String(score2);
                player1ScoreDisplay.textContent = String(score);
              } else if(p1HitP2Idx === p2TailIdx && snake2.length === 3){
                // Special mayhem rule: if defender is at minimum size, tail hit ends game in attacker's favor.
                p2Lose = true;
                p2LoseReason = 'Player 1 ate Player 2 tail at minimum size';
                setAttacker('p1');
              } else {
                p1Lose = true;
                p1LoseReason = 'Player 1 hit Player 2 body';
                setAttacker('p1');
              }
            }
          }

          const p2HitP1Idx = snake.findIndex(seg => seg.x===nx2 && seg.y===ny2);
          if(p2HitP1Idx !== -1){
            if(p2HitP1Idx === 0){
              // head-to-head: both lose and scores reset
              score = 0; score2 = 0;
              player2ScoreDisplay.textContent = String(score2);
              player1ScoreDisplay.textContent = String(score);
              p1Lose = true; p2Lose = true;
              p1LoseReason = 'Head-to-head collision';
              p2LoseReason = 'Head-to-head collision';
              setAttacker('both');
            } else {
              const p1TailIdx = snake.length - 1;
              const canEatTail = p2HitP1Idx === p1TailIdx && snake.length > 3;
              if(canEatTail){
                snake.pop();
                score2++;
                if(score > 0) score--;
                player2ScoreDisplay.textContent = String(score2);
                player1ScoreDisplay.textContent = String(score);
              } else if(p2HitP1Idx === p1TailIdx && snake.length === 3){
                // Special mayhem rule: if defender is at minimum size, tail hit ends game in attacker's favor.
                p1Lose = true;
                p1LoseReason = 'Player 2 ate Player 1 tail at minimum size';
                setAttacker('p2');
              } else {
                p2Lose = true;
                p2LoseReason = 'Player 2 hit Player 1 body';
                setAttacker('p2');
              }
            }
          }
        }
      }

      if(p1Lose || p2Lose){
        // Show final frame: only attacker advances, and attacker is drawn on top.
        if(collisionAttacker === 'p1'){
          snake.unshift({x:nx, y:ny});
          snake.pop();
          draw('p1');
        } else if(collisionAttacker === 'p2'){
          snake2.unshift({x:nx2, y:ny2});
          snake2.pop();
          draw('p2');
        } else {
          snake.unshift({x:nx, y:ny});
          snake2.unshift({x:nx2, y:ny2});
          snake.pop();
          snake2.pop();
          draw();
        }

        isGameActive = false;
        clearInterval(moveInterval);
        if(p1Lose && p2Lose){
          setTimeout(()=> endGame('Draw', p1LoseReason || p2LoseReason || 'both collided'), 450);
        } else if(p1Lose){
          setTimeout(()=> endGame('Player 2', p1LoseReason || 'Player 1 hit something'), 450);
        } else {
          setTimeout(()=> endGame('Player 1', p2LoseReason || 'Player 2 hit something'), 450);
        }
        return;
      }

      snake.unshift({x:nx, y:ny});
      snake2.unshift({x:nx2, y:ny2});

      let ate1 = false, ate2 = false;
      let usedBomb1 = false, usedBomb2 = false;
      for(let i=apples.length-1;i>=0;i--){
        const a = apples[i];
        if(!ate1 && nx===a.x && ny===a.y){ score++; apples.splice(i,1); player1ScoreDisplay.textContent = String(score); ate1 = true; continue; }
        if(!ate2 && nx2===a.x && ny2===a.y){ score2++; apples.splice(i,1); player2ScoreDisplay.textContent = String(score2); ate2 = true; }
      }

      if(isBombsMode){
        if(p1BombIdx !== -1){
          score = Math.max(0, score - 2);
          player1ScoreDisplay.textContent = String(score);
          for(let i=0;i<3;i++){
            if(snake.length > 1) snake.pop();
          }
          usedBomb1 = true;
        }
        if(p2BombIdx !== -1){
          score2 = Math.max(0, score2 - 2);
          player2ScoreDisplay.textContent = String(score2);
          for(let i=0;i<3;i++){
            if(snake2.length > 1) snake2.pop();
          }
          usedBomb2 = true;
        }
        if(usedBomb1 || usedBomb2){
          const hitBombIndices = [];
          if(p1BombIdx !== -1) hitBombIndices.push(p1BombIdx);
          if(p2BombIdx !== -1 && p2BombIdx !== p1BombIdx) hitBombIndices.push(p2BombIdx);
          hitBombIndices.sort((a,b)=>b-a).forEach(idx => bombs.splice(idx,1));
          placeBombs();
        }
      }

      if(!ate1 && !usedBomb1) snake.pop();
      if(!ate2 && !usedBomb2) snake2.pop();

      placeApples();
      if(isBombsMode) placeBombs();
      draw();
    }

    function endGame(winner, reason){
      isGameActive = false; clearInterval(moveInterval);
      sessionStorage.setItem('snakeMode','duo');
      sessionStorage.setItem('snakeP1Score', String(score));
      sessionStorage.setItem('snakeP2Score', String(score2));
      sessionStorage.setItem('snakeWinner', String(winner || 'Player 1'));
      sessionStorage.setItem('snakeWinReason', String(reason || ''));
      setTimeout(()=> location.href = 'snake_2_player_score.html', 300);
    }

    // controls
    window.addEventListener('keydown', (e)=>{
      const key = e.key;
      if(!isGameActive) return;
      const player1Input =
        key === 'ArrowUp' ? {x:0,y:-1} :
        key === 'ArrowDown' ? {x:0,y:1} :
        key === 'ArrowLeft' ? {x:-1,y:0} :
        key === 'ArrowRight' ? {x:1,y:0} :
        null;
      const player2Input =
        (key==='w' || key==='W') ? {x:0,y:-1} :
        (key==='s' || key==='S') ? {x:0,y:1} :
        (key==='a' || key==='A') ? {x:-1,y:0} :
        (key==='d' || key==='D') ? {x:1,y:0} :
        null;

      // player1 arrows
      if(player1Input){
        const lastDir = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : dir;
        if(!(lastDir.x === -player1Input.x && lastDir.y === -player1Input.y) && pendingDirs.length < 2){
          pendingDirs.push(player1Input);
        }
      }
      // player2 WASD
      if(player2Input){
        const lastDir2 = pendingDirs2.length ? pendingDirs2[pendingDirs2.length - 1] : dir2;
        if(!(lastDir2.x === -player2Input.x && lastDir2.y === -player2Input.y) && pendingDirs2.length < 2){
          pendingDirs2.push(player2Input);
        }
      }
    });

    function startCountdown(){
      let count = 3; overlayPhrase.textContent = catchphrases[Math.floor(Math.random() * catchphrases.length)]; overlayCount.textContent = String(count);
      const countdown = setInterval(()=>{ count--; if(count>0){ overlayCount.textContent = String(count); return; } overlayCount.textContent = 'GO'; clearInterval(countdown);
        setTimeout(()=>{
          startOverlay.classList.add('hidden'); isGameActive = true;
          // init positions: player1 right side, moving left
          snake = [ {x: Math.floor(COLS*0.75), y: Math.floor(ROWS/2)}, {x: Math.floor(COLS*0.75)+1, y: Math.floor(ROWS/2)}, {x: Math.floor(COLS*0.75)+2, y: Math.floor(ROWS/2)} ];
          dir = {x:-1,y:0}; pendingDirs = [];
          // player2 left side, moving right
          snake2 = [ {x: Math.floor(COLS*0.25), y: Math.floor(ROWS/2)}, {x: Math.floor(COLS*0.25)-1, y: Math.floor(ROWS/2)}, {x: Math.floor(COLS*0.25)-2, y: Math.floor(ROWS/2)} ];
          dir2 = {x:1,y:0}; pendingDirs2 = [];
          bombs = [];
          placeApples();
          if(isBombsMode) placeBombs();
          moveInterval = setInterval(moveTick, 120);
        }, 250);
      },1000);
    }

    // init
    draw(); player2ScoreDisplay.textContent = '0'; player1ScoreDisplay.textContent = '0'; startCountdown();

    // prevent arrow scrolling
    window.addEventListener('keydown', function(e){ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
  </script>
</body>
