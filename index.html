<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>HTML Games — Home</title>
	<style>
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#0b1220;color:#e6eef8}
		.wrap{max-width:900px;margin:6vh auto;padding:24px;text-align:center}
		h1{margin:0 0 12px;font-size:2.2rem}
		p.lead{color:#bcd3f0;margin:0 0 24px}
		.grid{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
		.card{background:#0f1724;padding:18px 24px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,.6);min-width:220px}
		.card h2{margin:0 0 8px;font-size:1.1rem}
		.card p{margin:0 0 12px;color:#9fb3d8;font-size:.95rem}
		.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#2b8cff;color:white;text-decoration:none}
		.foot{margin-top:28px;color:#98b6db;font-size:.9rem}
	</style>
</head>
<body>
	<div class="wrap">
		<h1>HTML Games</h1>
		<p class="lead">Choose a game to play.</p>

		<div class="grid">
			<div class="card">
				<h2>Pong</h2>
				<p>Classic Pong — open the main Pong page.</p>
				<a class="btn" href="pong/pong_starting_screen.html">Play Pong</a>
			</div>

			<div class="card">
				<h2>Catch the Mouse</h2>
				<p>Click the mouse as it appears.</p>
				<a class="btn" href="catch_mouse/catch_mouse.html">Play Catch the Mouse</a>
			</div>
		</div>

	</div>
</body>
</html>
