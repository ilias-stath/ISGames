<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catch Mouse — Start</title>
  <style>
    :root{
      --bg:#f4f6f8;
      --panel:#ffffff;
      --panel-border:rgba(15,23,42,0.06);
      --text:#1f2937;
      --muted:#54606f;
      --accent:#7ba7ff;
      --accent-2:#7cf7c2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: 'Arial', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(236, 72, 153, 0.12), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(100, 100, 100, 0.06), transparent 22%),
        linear-gradient(135deg, #f5f5f5, #fce7f3 55%, #e5e5e5);
      color:var(--text);
    }
    .panel{
      width:min(92vw,520px);
      padding:36px;
      border-radius:18px;
      background:var(--panel);
      border:1px solid var(--panel-border);
      box-shadow:0 18px 50px rgba(31,41,55,0.06);
      text-align:center;
    }
    h1{
      margin:0 0 8px;
      font-size:2.2rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--text);
    }
    p{margin:0 0 18px;color:var(--muted)}
    .buttons{
      display:flex;
      flex-direction:column;
      gap:12px;
      justify-content:center;
      align-items:center;
    }
    .speed-wrap{
      width:min(260px, 100%);
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--panel-border);
      background:rgba(255,255,255,0.55);
      text-align:left;
    }
    .speed-row{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
    }
    .speed-label{
      font-size:0.78rem;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
    }
    .speed-value{
      font-weight:800;
      color:#ec4899;
    }
    input[type="range"].speed{
      width:100%;
      accent-color:#ec4899;
    }
    .speed-hint{
      margin-top:6px;
      font-size:0.85rem;
      color:var(--muted);
    }
    .btn{
      border:0;
      padding:12px 18px;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
      font-size:1rem;
      transition:transform .12s ease,box-shadow .12s ease;
      width:min(260px, 100%);
    }
    .btn:focus{outline:2px solid rgba(123,167,255,0.25)}
    .start{background:linear-gradient(135deg,#ec4899,#ff1493,#ff69b4,#ff4d7d);color:#ffffff;box-shadow:0 6px 20px rgba(236,72,153,0.35)}
    .back{background:transparent;border:1px solid var(--panel-border);color:var(--text)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(31,41,55,0.06)}
    .hint{margin-top:14px;color:var(--muted);font-size:0.92rem}
  </style>
</head>
<body>
  <main class="panel">
    <h1>Catch Mouse</h1>
    <p>Catch the mouse — test your reflexes. Choose to start or go back home.</p>
    <div class="buttons">
      <button class="btn start" id="startBtn">Start Game</button>

      <div class="speed-wrap" role="group" aria-label="Speed selector">
        <div class="speed-row">
          <span class="speed-label">Speed</span>
          <span class="speed-value"><span id="speedValue">1</span>x</span>
        </div>
        <input class="speed" id="speedSlider" type="range" min="1" max="5" step="1" value="1" list="speedTicks" />
        <datalist id="speedTicks">
          <option value="1"></option>
          <option value="2"></option>
          <option value="3"></option>
          <option value="4"></option>
          <option value="5"></option>
        </datalist>
        <div class="speed-hint">Higher = faster</div>
      </div>

      <button class="btn back" id="homeBtn">Back to Home</button>
    </div>
    <div class="hint" id="catchPhrase"></div>
  </main>

  <script>
    const phrases = [
      'Fast hands win the prize.',
      'Keep your eyes on the mouse, it is a button and it is red.',
      'Don\'t blink.',
      'Reflexes > Luck.'
    ];
    document.getElementById('catchPhrase').textContent = phrases[Math.floor(Math.random()*phrases.length)];

    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const SPEED_KEY = 'catchMouseSpeed';

    // Restore previous selection if present
    const storedSpeed = Number(sessionStorage.getItem(SPEED_KEY));
    const initialSpeed = Number.isFinite(storedSpeed) && storedSpeed >= 1 && storedSpeed <= 5 ? storedSpeed : 1;
    speedSlider.value = String(initialSpeed);
    speedValue.textContent = String(initialSpeed);
    sessionStorage.setItem(SPEED_KEY, String(initialSpeed));

    speedSlider.addEventListener('input', () => {
      const v = Number(speedSlider.value);
      speedValue.textContent = String(v);
      sessionStorage.setItem(SPEED_KEY, String(v));
    });

    document.getElementById('startBtn').addEventListener('click', ()=>{
      sessionStorage.setItem('catchMouseStart','true');
      location.href = 'catch_mouse_game.html';
    });

    document.getElementById('homeBtn').addEventListener('click', ()=>{
      location.href = '../index.html';
    });
  </script>
</body>
</html>
