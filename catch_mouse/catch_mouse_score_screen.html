<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catch Mouse - Score</title>
<style>
	:root {
		--bg-light: #f5f7fa;
		--bg-dark: #e8ecf1;
		--text: #1a1f36;
		--text-muted: #6b7280;
		--accent: #ec4899;
		--accent-glow: #f472b6;
		--border: rgba(0, 0, 0, 0.08);
		--green: #10b981;
		--green-soft: rgba(16, 185, 129, 0.14);
		--red: #ef4444;
		--red-soft: rgba(239, 68, 68, 0.14);
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		min-height: 100vh;
		font-family: 'Arial', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
		color: var(--text);
		background: linear-gradient(180deg, #ffffff 0%, var(--bg-light) 50%, var(--bg-dark) 100%);
		overflow: hidden;
		display: grid;
		place-items: center;
	}

	.panel {
		width: min(94vw, 600px);
		padding: 36px 32px;
		border: 1px solid var(--border);
		border-radius: 20px;
		background: rgba(255, 255, 255, 0.8);
		box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
		backdrop-filter: blur(8px);
		text-align: center;
	}

	h1 {
		margin: 0;
		font-size: 0.9rem;
		letter-spacing: 0.2em;
		text-transform: uppercase;
		color: var(--text-muted);
	}

	.result-wrap {
		margin-top: 14px;
		display: grid;
		place-items: center;
	}

	.result-headline {
		font-size: 2rem;
		font-weight: 800;
		letter-spacing: 0.08em;
		margin-bottom: 12px;
		text-transform: uppercase;
	}

	.result-meta {
		margin-top: 8px;
		font-size: 0.92rem;
		letter-spacing: 0.12em;
		text-transform: uppercase;
		color: var(--text-muted);
	}

	.score-card {
		margin: 28px auto 24px;
		width: min(100%, 320px);
		padding: 24px 20px;
		border-radius: 16px;
		border: 2px solid;
		background: rgba(255, 255, 255, 0.5);
		text-align: center;
	}

	.score-card.positive {
		border-color: var(--green);
		box-shadow: 0 0 24px rgba(16, 185, 129, 0.2), inset 0 0 0 1px var(--green-soft);
	}

	.score-card.negative {
		border-color: var(--red);
		box-shadow: 0 0 24px rgba(239, 68, 68, 0.2), inset 0 0 0 1px var(--red-soft);
	}

	.score-label {
		font-size: 0.85rem;
		letter-spacing: 0.15em;
		text-transform: uppercase;
		color: var(--text-muted);
		margin-bottom: 12px;
	}

	.score-value {
		font-size: 4.5rem;
		font-weight: 800;
		line-height: 1;
	}

	.score-card.positive .score-value {
		color: var(--green);
		text-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
	}

	.score-card.negative .score-value {
		color: var(--red);
		text-shadow: 0 0 16px rgba(239, 68, 68, 0.3);
	}

	.buttons {
		margin-top: 20px;
		width: min(100%, 320px);
		display: grid;
		gap: 12px;
		margin-left: auto;
		margin-right: auto;
	}

	button {
		appearance: none;
		border: 0;
		border-radius: 12px;
		padding: 14px 20px;
		font-size: 1rem;
		font-weight: 700;
		cursor: pointer;
		transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
	}

	.primary {
		background: linear-gradient(135deg, var(--accent), var(--accent-glow));
		color: white;
	}

	.primary:hover {
		transform: translateY(-2px);
		box-shadow: 0 10px 24px rgba(236, 72, 153, 0.3);
	}

	.secondary {
		background: rgba(255, 255, 255, 0.7);
		color: var(--text);
		border: 1px solid var(--border);
	}

	.secondary:hover {
		transform: translateY(-1px);
		background: rgba(255, 255, 255, 0.85);
		box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
	}

	@media (max-width: 640px) {
		.panel {
			padding: 24px 16px;
		}

		.result-headline {
			font-size: 1.6rem;
		}

		.score-value {
			font-size: 3.5rem;
		}
	}
</style>
</head>
<body>
<main class="panel">
	<h1>Game Over</h1>
	<div class="result-wrap">
		<div class="result-headline" id="resultHeadline">Great Job!</div>
		<div class="result-meta" id="resultMeta">Final Score</div>
	</div>
	<div class="score-card" id="scoreCard">
		<div class="score-label">Final Score</div>
		<div class="score-value" id="scoreValue">0</div>
	</div>
	<div class="buttons">
		<button class="primary" id="replayButton">Play Again</button>
		<button class="secondary" id="menuButton">Back to Menu</button>
	</div>
</main>

<script>
	const scoreValue = document.getElementById('scoreValue');
	const scoreCard = document.getElementById('scoreCard');
	const resultHeadline = document.getElementById('resultHeadline');
	const resultMeta = document.getElementById('resultMeta');
	const replayButton = document.getElementById('replayButton');
	const menuButton = document.getElementById('menuButton');

	const finalScore = Number(sessionStorage.getItem('catchMouseScore') ?? '0');

	scoreValue.textContent = String(finalScore);

	const isPositive = finalScore > 0;
	const isNegative = finalScore < 0;

	if (isPositive) {
		scoreCard.classList.add('positive');
		scoreCard.classList.remove('negative');
		resultHeadline.textContent = 'Excellent!';
		resultHeadline.style.color = '#10b981';
	} else if (isNegative) {
		scoreCard.classList.add('negative');
		scoreCard.classList.remove('positive');
		resultHeadline.textContent = 'Game Over';
		resultHeadline.style.color = '#ef4444';
	} else {
		scoreCard.classList.add('negative');
		scoreCard.classList.remove('positive');
		resultHeadline.textContent = 'Neutral Score';
		resultHeadline.style.color = '#6b7280';
	}

	resultMeta.textContent = isPositive
		? `+${finalScore} points`
		: `${finalScore} points`;

	console.log('Final Score:', finalScore);
	console.log('Score from session:', sessionStorage.getItem('catchMouseScore'));

	replayButton.addEventListener('click', function() {
		sessionStorage.removeItem('catchMouseScore');
		window.location.replace('catch_mouse_game.html');
	});

	menuButton.addEventListener('click', function() {
		sessionStorage.removeItem('catchMouseScore');
		window.location.replace('catch_mouse_starting_screen.html');
	});
</script>
</body>
</html>
