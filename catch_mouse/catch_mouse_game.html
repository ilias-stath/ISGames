<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catch Me Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-area {
            width: 600px;
            height: 400px;
            border: 2px solid #333;
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        #catch-button {
            position: absolute;
            padding: 10px 20px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.1s;
        }

        #score {
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="game-area">
        <button id="catch-button">Catch Me</button>
    </div>

    <script>
        const button = document.getElementById("catch-button");
        const gameArea = document.getElementById("game-area");
        const scoreDisplay = document.getElementById("score");

        let score = 0;

        function moveButton() {
            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight;
            const btnWidth = button.offsetWidth;
            const btnHeight = button.offsetHeight;

            const randomX = Math.random() * (areaWidth - btnWidth);
            const randomY = Math.random() * (areaHeight - btnHeight);

            button.style.left = randomX + "px";
            button.style.top = randomY + "px";
        }

		button.addEventListener("keydown", (event) => {
			event.preventDefault(); // Blocks Enter and Space from triggering click
		});
		
        button.addEventListener("click", () => {
            score++;
            scoreDisplay.textContent = `Score: ${score}`;
            moveButton();
        });
		

        setInterval(moveButton, 1500);

        moveButton();
    </script>
</body>
</html>
